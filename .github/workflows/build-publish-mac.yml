name: Mac builds

on: [push, workflow_dispatch]

jobs:
  build_and_publish:
    strategy:
      matrix:
        # macos-14+ are apple silicon runners; macos-13 (intel) was removed
        # because GitHub's intel macOS runners are being deprecated and are
        # too scarce to schedule reliably.
        os: [macos-14, macos-15]

    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Wheels
        uses: pypa/cibuildwheel@v2.23.4
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_PROJECT_REQUIRES_PYTHON: '>=3.10'
          MACOSX_DEPLOYMENT_TARGET: 15.2

      - uses: actions/upload-artifact@v4
        with:
          name: pygeoda-${{ matrix.os }}
          path: wheelhouse/

      # Both matrix runners build identical wheels, so publish must run on a
      # single job only -- otherwise the two jobs race to upload the same
      # filenames and PyPI rejects the second with 400 "file already exists".
      - name: Publish to Pypi
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-14'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade --upgrade-strategy eager twine setuptools
          python3 -m twine upload wheelhouse/*.whl

      - name: Publish source to Pypi
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-14'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          source venv/bin/activate
          python3 setup.py sdist
          python3 -m twine upload dist/*.tar.gz
